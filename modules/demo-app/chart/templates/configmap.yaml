apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-page
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  index.html: |
    <!doctype html>
    <html><head><title>Terraform + Terragrunt + Helm</title></head><body>
      <h1>{{ .Values.greeting }}</h1>
      <p>Rendered by the Helm chart; configured by a Terraform child module.</p>
    </body></html>
